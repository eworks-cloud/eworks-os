name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether web/ app exists yet
        id: web
        run: echo "exists=$(test -f web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - if: steps.web.outputs.exists == 'true'
        run: npm ci --prefix web
      - if: steps.web.outputs.exists == 'true'
        run: npm test --prefix web
      - if: steps.web.outputs.exists != 'true'
        run: echo "web/ does not exist yet (Epic 11 not started) — nothing to test."
